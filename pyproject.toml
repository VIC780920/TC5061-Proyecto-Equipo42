[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici_mlops"
version = "0.0.1"
description = "Pipeline reproducible de Machine Learning para el an\u00e1lisis de datos de MiBici"
authors = [
  { name = "Equipo 42" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["mibici_mlops"]
include = ["pyproject.toml", "mibici_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici_mlops"]
force-sort-within-sections = true

